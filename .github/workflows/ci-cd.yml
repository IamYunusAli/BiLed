name: CI/CD

# Branch flow:  feature/* | release/*  --PR-->  development  --PR-->  staging  --PR-->  main
#
#   every push (any branch) and every PR  ->  Test
#   every PR                              ->  Promotion rules (only the allowed source branch may target each branch)
#   push to main                          ->  Test, then Deploy to production (only if Test passed)
#
#   development and staging are integration branches: fully tested on every push and PR, never deployed.
#   Only main is deployed: GitHub environment "production" (Neon branch "production", Render service daps-tracker),
#   which holds the secrets DATABASE_URL_DIRECT and RENDER_DEPLOY_HOOK_URL and the variable APP_URL.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, staging, main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/tracker_test
      JWT_SECRET: ci-only-${{ github.run_id }}-not-a-real-secret-padding
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (app, pages, browser script, tests, scripts, migrations)
        run: npm run typecheck
      - name: Build (the same tsc build Render runs)
        run: npm run build
      - name: Apply all migrations
        run: npm run migrate:up
      - name: Check migrations (priority backfill + every migration reversible)
        run: npm run check:migrations
      - name: Run tests
        run: npm test

  promotion-rules:
    name: Promotion rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only the allowed source branch may target each branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)        allowed="staging" ;;
            staging)     allowed="development" ;;
            development) allowed="feature/* fix/* hotfix/* release/*" ;;
            *)           echo "No rule for $BASE"; exit 0 ;;
          esac
          for pattern in $allowed; do
            case "$HEAD" in $pattern) echo "OK: $HEAD -> $BASE"; exit 0 ;; esac
          done
          echo "::error::$HEAD may not be merged into $BASE (allowed: $allowed)"
          exit 1

  deploy:
    name: Deploy to production
    needs: test # the gate: never starts unless every test passed
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Read from the "production" GitHub Environment; only this job (running on main) can access them.
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check this environment is configured
        run: |
          missing=""
          [ -n "$DATABASE_URL" ] || missing="$missing database-url"
          [ -n "$DEPLOY_HOOK" ] || missing="$missing deploy-hook"
          [ -n "$APP_URL" ] || missing="$missing app-url"
          if [ -n "$missing" ]; then echo "::error::The production environment is not configured, missing:$missing"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false # no shared cache in the job that holds deployment secrets
      - name: Install dependencies
        run: npm ci
      - name: Migrate the production database (Neon direct connection)
        run: npm run migrate:up
      - name: Deploy this exact commit to Render
        run: curl -fsS -X POST -o /dev/null "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
      - name: Wait until the new commit is live
        run: bash scripts/wait-for-deploy.sh "$APP_URL" "$GITHUB_SHA"
      - name: Smoke test
        run: |
          curl -fsS "$APP_URL/healthz"
          curl -fsS -o /dev/null "$APP_URL/login"
